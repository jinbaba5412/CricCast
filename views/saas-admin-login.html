<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CricCast Operations Console</title>

<script src="/assets/cc-theme.js?v=20260429b"></script>
<link rel="stylesheet" href="/assets/cc-tokens.css?v=20260429b">
<link rel="stylesheet" href="/assets/cc-bridge.css?v=20260429b">
<link rel="stylesheet" href="/assets/cc-base.css?v=20260429b">

<style>
  /* Ops variant: re-color the auth shell amber, inherit everything else. */
  .ops-card {
    border-left: 3px solid var(--cc-accent-amber);
    background: var(--cc-surface-container);
    border: 1px solid var(--cc-border);
    border-left: 3px solid var(--cc-accent-amber);
    border-radius: var(--cc-r-lg);
    padding: 28px 28px 24px;
    width: 100%; max-width: 420px;
    margin: 0 auto;
    box-shadow: var(--cc-shadow-md);
  }
  .ops-brand {
    font-family: var(--cc-font-display);
    font-size: 30px; letter-spacing: 4px;
    color: var(--cc-accent-amber);
    margin-bottom: 4px; line-height: 1;
  }
  .ops-eyebrow {
    font-size: 11px; color: var(--cc-text-muted);
    text-transform: uppercase; letter-spacing: 0.12em;
    margin-bottom: 22px;
  }
  .ops-h2 {
    font-size: 16px; font-weight: 600;
    color: var(--cc-text-primary);
    margin: 0 0 4px;
  }
  .ops-sub {
    font-size: 13px; color: var(--cc-text-muted);
    margin: 0 0 22px;
  }
  .ops-amber-input:focus {
    outline: none;
    border-color: var(--cc-accent-amber) !important;
    box-shadow: 0 0 0 3px rgba(245,158,11,0.22) !important;
  }
  .ops-foot {
    margin-top: 22px; padding-top: 16px;
    border-top: 1px solid var(--cc-border);
    text-align: center;
    font-size: 12px; color: var(--cc-text-muted);
  }
  .ops-foot .ok { color: var(--cc-accent-primary); font-weight: 600; }
  .ops-tile-stack {
    display: flex; flex-direction: column; gap: 14px;
    width: 100%; max-width: 460px;
  }
  .ops-tile {
    background: var(--cc-surface-container);
    border: 1px solid var(--cc-border);
    border-radius: var(--cc-r-md);
    padding: 14px;
    display: flex; gap: 12px; align-items: center;
    position: relative;
    overflow: hidden;
  }
  .ops-tile.amber { border-color: rgba(245,158,11,0.32); }
  .ops-tile.amber::before {
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
    background: var(--cc-accent-amber);
  }
  .ops-tile .ic {
    width: 36px; height: 36px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    background: var(--cc-accent-primary-soft);
    color: var(--cc-accent-primary);
  }
  .ops-tile.cyan  .ic { background: var(--cc-accent-cyan-soft);  color: var(--cc-accent-cyan); }
  .ops-tile.amber .ic { background: var(--cc-accent-amber-soft); color: var(--cc-accent-amber); }
  .ops-tile h4 {
    font-size: 13px; font-weight: 600;
    color: var(--cc-text-primary); margin: 0 0 2px;
  }
  .ops-tile p {
    font-size: 12px; color: var(--cc-text-muted); margin: 0;
  }
</style>
</head>
<body class="cc-body">
  <!-- Amber stripe signals elevated context -->
  <div class="cc-ops-stripe"></div>

  <div class="cc-auth-shell">
    <div class="cc-auth-theme" data-cc-theme-mount aria-label="Theme"></div>

    <!-- LEFT: form -->
    <div class="cc-auth-pane cc-auth-form-pane">
      <div class="ops-card">
        <div class="ops-brand">CRICCAST</div>
        <div class="ops-eyebrow">Operations Console</div>

        <h2 class="ops-h2">Secure Access</h2>
        <p class="ops-sub">Authorized personnel only. Verify your credentials.</p>

        <div class="cc-auth-error" id="err" role="alert" aria-live="polite"></div>

        <div class="cc-auth-field">
          <label for="email">Operator ID</label>
          <div class="cc-auth-field-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="9" cy="12" r="2.5"/><path d="M14 11h5M14 14h3"/></svg>
            <input type="email" id="email" class="ops-amber-input" placeholder="admin@criccast.app" autocomplete="username">
          </div>
        </div>

        <div class="cc-auth-field">
          <label for="password">Passcode</label>
          <div class="cc-auth-field-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" class="ops-amber-input" placeholder="••••••••" autocomplete="current-password">
          </div>
        </div>

        <button id="btn" class="cc-auth-cta cc-auth-cta--ops" onclick="login()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-right:6px;vertical-align:middle;"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></svg>
          Initialize Session
        </button>

        <div class="ops-foot">
          System Status: <span class="ok">Online</span>
        </div>
      </div>
    </div>

    <!-- RIGHT: status tiles (desktop only) -->
    <div class="cc-auth-pane cc-auth-hero-pane" aria-hidden="true">
      <div class="cc-auth-hero-bg"></div>
      <div class="ops-tile-stack">
        <div class="ops-tile">
          <div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div>
          <div>
            <h4>99.9% Uptime</h4>
            <p>All systems operational</p>
          </div>
        </div>
        <div class="ops-tile cyan">
          <div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="14" width="20" height="8" rx="2"/><path d="M5 18h.01M9 18h.01"/><path d="M5 14V6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v8"/></svg></div>
          <div>
            <h4>Live Feeds Active</h4>
            <p>Routing concurrent streams</p>
          </div>
        </div>
        <div class="ops-tile amber">
          <div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 12 0v1"/><path d="M19 16v-2"/><path d="M19 19v.01"/></svg></div>
          <div>
            <h4>Ops Authentication Required</h4>
            <p>Awaiting operator sign-in</p>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
/* PRESERVED VERBATIM — login(), showErr(), IDs (email/password/btn/err),
   POST /saas-admin/login, redirect, Enter key on #password. */
document.getElementById('password').addEventListener('keydown', e => { if(e.key==='Enter') login(); });
async function login() {
  const btn=document.getElementById('btn'), err=document.getElementById('err');
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  if(!email||!password){showErr('Email and password required.');return;}
  btn.disabled=true; btn.textContent='Signing in…';
  try {
    const r=await fetch('/saas-admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const d=await r.json();
    if(d.ok){window.location.href=d.redirect||'/saas-admin';}
    else showErr(d.error||'Login failed.');
  } catch(e){showErr('Network error.');}
  finally{btn.disabled=false;btn.textContent='Initialize Session';}
}
function showErr(msg){const e=document.getElementById('err');e.textContent=msg;e.style.display='block';}
</script>
</body>
</html>
