<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CricCast — Layout 6: Minimalist Light</title>
<style type="text/css">@font-face{font-family:Bebas Neue;src:url(https://fonts.gstatic.com/s/bebasneue/v14/JTUSjIg69CK48gW7PXoo9Wlhyw.woff2);font-display:swap;}@font-face{font-family:Barlow Condensed;font-style:normal;font-weight:700;src:url(https://fonts.gstatic.com/s/barlowcondensed/v12/HTxwLwI-JCGChYJ8VI-L6OO_au7B43_3z3b-.woff2);font-display:swap;}@font-face{font-family:Barlow Condensed;font-style:normal;font-weight:900;src:url(https://fonts.gstatic.com/s/barlowcondensed/v12/HTxwLwI-JCGChYJ8VI-L6OO_au7B45_1z3b-.woff2);font-display:swap;}</style>
<style>
/* ── LAYOUT 6: MINIMALIST LIGHT ── */
:root{--gold:#d97706;--blue:#1d4ed8;--danger:#dc2626;--bat-color:#1d4ed8;--bowl-color:#6b7280;--text:#111;--muted:#6b7280;--bg:#f1f5f9;--card:#fff;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Barlow Condensed',sans-serif;font-weight:700;background:transparent;color:var(--text);overflow:hidden;}.overlay-wrap{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:fixed;inset:0;padding:0 0 10px 0;z-index:100;}

.broadcast-bar{width:100%;height:84px;background:var(--card);display:flex;align-items:stretch;border-top:4px solid var(--bat-color);box-shadow:0 -4px 24px rgba(0,0,0,0.1),0 -1px 0 rgba(0,0,0,0.05);}
/* Bat side */
.ml-bat{display:flex;align-items:center;gap:10px;background:var(--bat-color);padding:0 16px;min-width:200px;clip-path:polygon(0 0,100% 0,calc(100%-16px) 100%,0 100%);}
.ml-bat .ml-badge{width:48px;height:48px;background:rgba(255,255,255,0.2);border:2px solid rgba(255,255,255,0.4);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
.ml-bat .ml-badge img,.ml-bat .ml-badge svg{width:36px;height:36px;object-fit:contain;}
.ml-bat .ml-team-name{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;color:#fff;line-height:1;}
.ml-bat .ml-team-score{font-family:'Bebas Neue',sans-serif;font-size:28px;color:rgba(255,255,255,0.95);letter-spacing:1px;}
/* Center */
.ml-center{flex:1;display:flex;align-items:center;padding:0 20px;gap:24px;background:var(--card);border-right:1px solid #e2e8f0;}
.ml-batter{display:flex;flex-direction:column;}
.ml-batter-name{font-size:16px;font-weight:900;text-transform:uppercase;color:var(--bat-color);letter-spacing:.5px;}
.ml-batter-name.ns{color:var(--muted);}
.ml-batter-stat{font-size:14px;color:var(--muted);}
.ml-vert{width:1px;height:50px;background:#e2e8f0;flex-shrink:0;}
/* Scoring */
.ml-score-main{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:150px;}
.ml-score-num{font-family:'Bebas Neue',sans-serif;font-size:46px;color:var(--text);letter-spacing:2px;line-height:1;}
.ml-score-overs{font-size:13px;color:var(--muted);letter-spacing:1px;}
/* Rates */
.ml-rate{display:flex;flex-direction:column;align-items:center;}
.ml-rate-label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);}
.ml-rate-val{font-size:20px;color:var(--text);font-family:'Bebas Neue',sans-serif;letter-spacing:1px;}
/* Bowler */
.ml-bowl-block{display:flex;flex-direction:column;gap:2px;min-width:160px;}
.ml-bowl-name{font-size:16px;font-weight:900;text-transform:uppercase;color:var(--text);}
.ml-bowl-fig{font-size:14px;color:var(--muted);}
.ml-balls{display:flex;gap:4px;margin-top:2px;}
.ml-ball{width:22px;height:22px;background:var(--bat-color);color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ml-ball.small-text{font-size:8px;}
/* Bowl side */
.ml-bowl{display:flex;align-items:center;gap:10px;background:var(--bg);padding:0 16px;min-width:170px;border-left:4px solid var(--bowl-color);flex-direction:row-reverse;}
.ml-bowl .ml-badge{width:48px;height:48px;background:rgba(107,114,128,0.1);border:2px solid var(--bowl-color);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
.ml-bowl .ml-badge img,.ml-bowl .ml-badge svg{width:36px;height:36px;object-fit:contain;color:var(--bowl-color);}
.ml-bowl .ml-team-name{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;color:var(--text);line-height:1.1;text-align:right;}
.ml-bowl .ml-team-score{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--bowl-color);letter-spacing:1px;text-align:right;}
.bb-winner-full{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(90deg,var(--card),#e0f2fe);border-top:4px solid var(--bat-color);z-index:20;}
.bb-winner-full .w-title{font-family:'Bebas Neue',sans-serif;font-size:54px;color:var(--bat-color);line-height:1;letter-spacing:3px;}
.bb-winner-full .w-desc{font-size:22px;color:var(--muted);font-weight:900;letter-spacing:3px;margin-top:4px;}
</style>
</head>
<body>
<div class="overlay-wrap" id="master-wrap" style="display:none;">
  <div class="broadcast-bar" id="master-broadcast-bar" style="display:none;position:relative;">
    <div class="bb-winner-full" id="bb-winner-ui"><div class="w-title" id="w-big-text">TEAM WINS</div><div class="w-desc" id="w-sub-text">BY X RUNS</div></div>
    <div class="ml-bat">
      <div class="ml-badge" id="bb-logo-bat-inner"></div>
      <div><div class="ml-team-name" id="bb-bat-name">BATTING</div><div class="ml-team-score" id="bb-bat-score">0/0</div></div>
    </div>
    <div class="ml-center">
      <div class="ml-batter">
        <span id="bb-p1-bat" style="display:inline-block;width:7px;height:7px;background:#fff;border-radius:50%;margin-right:4px;flex-shrink:0;"></span><div class="ml-batter-name" id="bb-p1-name">STRIKER</div>
        <div class="ml-batter-stat" id="bb-p1-stat">0 (0)</div>
      </div>
      <div class="ml-vert"></div>
      <div class="ml-batter">
        <span id="bb-p2-bat" style="display:inline-block;width:7px;height:7px;background:transparent;border-radius:50%;margin-right:4px;flex-shrink:0;vertical-align:middle;"></span><div class="ml-batter-name ns" id="bb-p2-name">NON-STRIKER</div>
        <div class="ml-batter-stat" id="bb-p2-stat">0 (0)</div>
      </div>
      <div class="ml-vert"></div>
      <div class="ml-score-main">
        <div class="ml-score-num" id="bb-main-score">0<span style="color:#94a3b8;font-size:34px;">/</span>0</div>
        <div class="ml-score-overs" id="bb-overs">OVERS 0.0</div>
      </div>
      <div class="ml-vert"></div>
      <div class="ml-rate"><div class="ml-rate-label">CRR</div><div class="ml-rate-val" id="bb-crr-center">0.00</div></div>
      <div class="ml-rate" id="bb-rrr-box" style="visibility:hidden;"><div class="ml-rate-label" style="color:var(--danger);">RRR</div><div class="ml-rate-val" id="bb-rrr-center" style="color:var(--danger);">0.00</div></div>
      <div class="ml-rate" id="target-box" style="display:none;"><div class="ml-rate-label" style="color:var(--gold);">TGT</div><div class="ml-rate-val" id="bb-target" style="color:var(--gold);">0</div></div>
      <div class="ml-vert"></div>
      <div class="ml-bowl-block">
        <div class="ml-bowl-name" id="bb-bowler-name">BOWLER</div>
        <div class="ml-bowl-fig" id="bb-bowler-stats">(0-0)</div>
        <div class="ml-balls" id="bb-thisover">—</div>
      </div>
    </div>
    <div class="ml-bowl">
      <div class="ml-badge" id="bb-logo-bowl-inner"></div>
      <div><div class="ml-team-name" id="bb-bowl-name">BOWLING</div><div class="ml-team-score" id="bb-bowl-sub">—</div></div>
    </div>
  </div>
  <!-- Overlays use dark theme -->
  <div id="innings-card" style="display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:900px;max-width:calc(100vw - 80px);background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.15);border-bottom:4px solid var(--bat-color);z-index:20;color:var(--text);"><div class="ic-header" style="display:flex;align-items:center;gap:16px;padding:14px 20px;background:linear-gradient(135deg,var(--bat-color),#3b82f6);border-bottom:1px solid #e2e8f0;"><div id="ic-logo" style="width:52px;height:52px;border:2px solid rgba(255,255,255,0.4);background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;"></div><div style="flex:1;"><div id="ic-team-name" style="font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:4px;color:#fff;">TEAM</div><div id="ic-subtitle" style="font-size:13px;color:rgba(255,255,255,0.8);letter-spacing:2px;">OVERS 0.0</div></div><div><div id="ic-total-badge" style="font-family:'Bebas Neue',sans-serif;font-size:36px;color:#fff;text-align:right;">0/0</div><div id="ic-overs-badge" style="font-size:14px;color:rgba(255,255,255,0.8);text-align:right;">OVERS 0.0</div></div></div><div style="max-height:60vh;overflow-y:auto;"><div id="ic-bat-title" style="padding:8px 20px;background:#f8fafc;color:var(--bat-color);font-size:14px;font-weight:900;letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid #e2e8f0;">BATTING</div><div id="target-strip"></div><table style="width:100%;border-collapse:collapse;"><thead><tr style="background:#f8fafc;"><th style="padding:8px 20px;font-size:12px;color:var(--muted);text-align:left;">BATSMAN</th><th style="padding:8px 20px;font-size:12px;color:var(--muted);text-align:right;">R</th><th style="padding:8px 20px;font-size:12px;color:var(--muted);text-align:right;">B</th><th style="padding:8px 20px;font-size:12px;color:var(--muted);text-align:right;">4s</th><th style="padding:8px 20px;font-size:12px;color:var(--muted);text-align:right;">6s</th><th style="padding:8px 20px;font-size:12px;color:var(--muted);text-align:right;">SR</th></tr></thead><tbody id="ic-bat-tbody"></tbody></table><div id="ic-bowl-title" style="padding:8px 20px;background:#f8fafc;color:var(--bat-color);font-size:14px;font-weight:900;letter-spacing:2px;text-transform:uppercase;border-top:1px solid #e2e8f0;border-bottom:1px solid #e2e8f0;">BOWLING</div><table style="width:100%;border-collapse:collapse;"><thead><tr style="background:#f8fafc;"><th style="padding:8px 20px;font-size:12px;color:var(--muted);text-align:left;">BOWLER</th><th style="padding:8px 20px;font-size:12px;color:var(--muted);text-align:right;">O</th><th style="padding:8px 20px;font-size:12px;color:var(--muted);text-align:right;">R</th><th style="padding:8px 20px;font-size:12px;color:var(--muted);text-align:right;">W</th><th style="padding:8px 20px;font-size:12px;color:var(--muted);text-align:right;">ECON</th></tr></thead><tbody id="ic-bowl-tbody"></tbody></table></div><div style="display:flex;justify-content:space-between;padding:10px 16px;background:#f8fafc;border-top:1px solid #e2e8f0;"><span style="font-size:14px;color:var(--muted);">EXTRAS <span id="ic-extras-val" style="color:var(--text);margin-left:6px;">0</span></span><span style="font-size:14px;color:var(--muted);">TOTAL <span id="ic-footer-total" style="color:var(--text);margin-left:6px;">0/0</span></span></div></div>
  <div id="match-summary-card" style="display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:1000px;max-width:calc(100vw - 80px);background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.15);z-index:20;color:var(--text);"><div style="padding:18px 28px;background:linear-gradient(135deg,var(--bat-color),#3b82f6);border-bottom:2px solid var(--bat-color);text-align:center;"><div style="font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:6px;color:#fff;">MATCH SUMMARY</div></div><div id="ms-body" style="display:grid;grid-template-columns:1fr 1fr;"></div><div id="ms-result" style="padding:14px;text-align:center;font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:4px;color:#fff;background:var(--bat-color);">MATCH IN PROGRESS</div></div>
  <div id="team-sheet-card" data-active-tab="bat" style="display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:800px;max-width:calc(100vw - 80px);z-index:20;"></div>
</div>
<script src="scoreboard-core-offline.js"></script>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/EasePack.min.js"></script>
<script src="vendor/confetti.min.js"></script>

<script>
function applyThemeColors(bat,bowl){document.documentElement.style.setProperty('--bat-color',bat);document.documentElement.style.setProperty('--bowl-color',bowl);document.querySelector('.ml-bat').style.background=bat;document.querySelector('.ml-bowl').style.borderLeftColor=bowl;}
function renderBroadcastBar(m,t){
  const bat=t.find(x=>x.id===m.batTeamId),bowl=t.find(x=>x.id===m.bowlTeamId);
  document.getElementById('bb-logo-bat-inner').innerHTML='';document.getElementById('bb-logo-bowl-inner').innerHTML='';
  document.getElementById('bb-bat-name').textContent=bat?bat.name.toUpperCase():'BATTING';document.getElementById('bb-bowl-name').textContent=bowl?bowl.name.toUpperCase():'BOWLING';
  document.getElementById('bb-bat-score').textContent=`${m.runs||0}/${m.wickets||0}`;document.getElementById('bb-bowl-sub').textContent=m.inning===2?`TGT ${m.target||0}`:'—';
  if(m.isFinished){document.getElementById('bb-winner-ui').style.display='flex';document.getElementById('w-big-text').textContent=m.winner.toUpperCase();document.getElementById('w-sub-text').textContent=m.winDesc.toUpperCase();}
  else{document.getElementById('bb-winner-ui').style.display='none';document.getElementById('bb-p1-name').textContent=(m||matchData)?.p1?.name||'STRIKER';{const _o=(m||matchData)?.batsmanStats?.[(m||matchData)?.p1?.name]?.out;const _e=document.getElementById('bb-p1-name');if(_e)_e.style.color=_o?'rgba(255,255,255,0.32)':'';}document.getElementById('bb-p1-stat').textContent=`${m.p1?.runs||0} (${m.p1?.balls||0})`;document.getElementById('bb-p2-name').textContent=m.p2?.name||'NON-STRIKER';document.getElementById('bb-p2-stat').textContent=`${m.p2?.runs||0} (${m.p2?.balls||0})`;document.getElementById('bb-bowler-name').textContent=m.bowler?m.bowler.toUpperCase():'BOWLER';document.getElementById('bb-bowler-stats').textContent=`(${m.bowlerWickets||0}-${m.bowlerRuns||0})`;document.getElementById('bb-thisover').innerHTML=m.thisOverBalls?.length?m.thisOverBalls.map(b=>`<div class="ml-ball${b.toString().length>2?' small-text':''}">${b}</div>`).join(''):'—';}
  document.getElementById('bb-main-score').innerHTML=`${m.runs||0}<span style="color:#94a3b8;font-size:34px;">/</span>${m.wickets||0}`;document.getElementById('bb-overs').textContent=`OVERS ${Math.floor((m.balls||0)/6)}.${(m.balls||0)%6}`;document.getElementById('bb-crr-center').textContent=((m.runs||0)/((m.balls||0)/6||0.01)).toFixed(2);
  if(m.inning===2){document.getElementById('target-box').style.display='';document.getElementById('bb-rrr-box').style.visibility='visible';document.getElementById('bb-target').textContent=m.target||0;const r=Math.max(0,(m.target||0)-(m.runs||0)),b=(m.maxOvers*6)-(m.balls||0);document.getElementById('bb-rrr-center').textContent=b>0?(r/(b/6)).toFixed(2):'0.00';}else{document.getElementById('target-box').style.display='none';document.getElementById('bb-rrr-box').style.visibility='hidden';}
}
const st=document.createElement('style');st.textContent=`.ic-table{width:100%;border-collapse:collapse;}.ic-table tbody tr{border-bottom:1px solid #e2e8f0;}.ic-table tbody tr.striker-row{background:#eff6ff;}.ic-table td{padding:9px 20px;font-size:16px;font-weight:700;color:var(--text);text-align:left;}.ic-table td:not(:first-child){text-align:right;}.ic-table td.batter-name{font-size:17px;font-weight:900;text-transform:uppercase;}.ic-table td.batter-name .not-out{color:var(--bat-color);font-size:12px;margin-left:4px;vertical-align:super;}.ic-table td.batter-name .out-label{font-size:12px;color:var(--muted);display:block;}.ic-runs{font-size:20px;font-weight:900;}.ic-balls{color:var(--muted);}.ic-4{color:#059669;}.ic-6{color:#0891b2;}.ic-sr{color:var(--muted);font-size:14px;}.ms-innings{padding:20px 24px;}.ms-innings:first-child{border-right:1px solid #e2e8f0;}.ms-inn-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #e2e8f0;}.ms-inn-logo{width:44px;height:44px;background:#f1f5f9;border:2px solid #e2e8f0;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}.ms-inn-team{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--text);}.ms-inn-label{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;}.ms-inn-score{margin-left:auto;text-align:right;}.ms-inn-score .runs{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--bat-color);letter-spacing:2px;line-height:1;}.ms-inn-score .overs{font-size:13px;color:var(--muted);}.ms-section-label{font-size:12px;font-weight:900;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid #e2e8f0;}.ms-player-row,.ms-bowl-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #f1f5f9;}.ms-player-name,.ms-bowl-name{font-size:16px;font-weight:900;text-transform:uppercase;color:var(--text);}.ms-player-name .status{color:var(--bat-color);font-size:11px;margin-left:4px;}.ms-player-stat{font-size:16px;font-weight:700;}.ms-player-stat .main{font-size:20px;font-weight:900;color:var(--text);}.ms-player-stat .balls{color:var(--muted);font-size:14px;}.ms-bowl-fig .w{color:var(--danger);font-size:20px;font-weight:900;}.ms-bowl-fig .r{color:var(--muted);}.ms-gap{height:16px;}.ms-result-banner.win-bat{background:var(--bat-color)!important;}.ms-result-banner.tied{background:var(--muted)!important;}.ts-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.12);border-bottom:4px solid var(--bat-color);width:100%;}.ts-header{display:flex;align-items:center;gap:16px;padding:20px 24px;background:linear-gradient(135deg,var(--bat-color),#3b82f6);border-bottom:1px solid #e2e8f0;}.ts-logo{width:64px;height:64px;border:3px solid rgba(255,255,255,0.4);background:rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}.ts-logo img,.ts-logo svg{width:52px;height:52px;}.ts-team-info{flex:1;}.ts-team-name{font-family:'Bebas Neue',sans-serif;font-size:40px;letter-spacing:4px;color:#fff;line-height:1;}.ts-team-sub{font-size:13px;color:rgba(255,255,255,0.8);font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-top:3px;}.ts-tabs{display:flex;}.ts-tab{padding:8px 16px;border:1px solid rgba(255,255,255,0.3);color:rgba(255,255,255,0.8);border-radius:8px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:900;letter-spacing:1px;text-transform:uppercase;display:flex;align-items:center;gap:6px;transition:all .2s;margin-left:6px;}.ts-tab.active{background:#fff;color:var(--bat-color);border-color:#fff;}.ts-list-header{display:grid;grid-template-columns:36px 1fr 90px;padding:8px 20px;background:#f8fafc;border-bottom:1px solid #e2e8f0;font-size:12px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}.ts-player-row{display:grid;grid-template-columns:36px 1fr 90px;align-items:center;padding:10px 20px;border-bottom:1px solid #f1f5f9;}.ts-player-num{color:var(--muted);font-size:15px;}.ts-player-name{font-size:18px;font-weight:900;text-transform:uppercase;color:var(--text);}.ts-player-role{display:flex;align-items:center;}.role-chip{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase;background:#f1f5f9;color:var(--muted);}.role-chip.bat{background:#dbeafe;color:#1d4ed8;}.role-chip.bowl{background:#fee2e2;color:#dc2626;}.role-chip.wk{background:#d1fae5;color:#059669;}.role-chip.all{background:#ede9fe;color:#7c3aed;}.ts-footer{padding:12px 20px;text-align:center;background:#f8fafc;border-top:1px solid #e2e8f0;}`;document.head.appendChild(st);
</script>
</body>
