<style>
/* ── LAYOUT 9: NEON GLOW (Cyberpunk) ── */
:root{--neon:#00ffe7;--neon-pink:#ff00a8;--gold:#f59e0b;--bat-color:#003366;--bowl-color:#330022;--text:#fff;--muted:rgba(0,255,231,0.7);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Barlow Condensed',sans-serif;font-weight:700;background:transparent;color:var(--text);overflow:hidden;}.overlay-wrap{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:fixed;inset:0;padding:0 0 10px 0;z-index:100;}

.broadcast-bar{width:100%;height:90px;background:#050913;border-top:2px solid var(--neon);border-bottom:2px solid var(--neon);box-shadow:0 -6px 30px rgba(0,255,231,0.3),0 6px 30px rgba(0,255,231,0.15),inset 0 1px 0 rgba(0,255,231,0.1);display:flex;align-items:center;position:relative;overflow:visible;}
/* Scanline effect */
.broadcast-bar::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,231,0.012) 2px,rgba(0,255,231,0.012) 4px);pointer-events:none;z-index:0;}
.ng-bat{display:flex;align-items:center;gap:8px;padding:0 14px;min-width:200px;flex-shrink:0;z-index:1;border-right:1px solid rgba(0,255,231,0.2);}
.ng-badge{width:52px;height:52px;border-radius:8px;border:1px solid var(--neon);background:rgba(0,255,231,0.08);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 12px rgba(0,255,231,0.3);}
.ng-badge img,.ng-badge svg{width:40px;height:40px;object-fit:contain;}
.ng-team-name{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;color:var(--neon);text-shadow:0 0 8px rgba(0,255,231,0.6);line-height:1;}
.ng-score{font-family:'Bebas Neue',sans-serif;font-size:28px;color:#fff;letter-spacing:2px;text-shadow:0 0 10px rgba(0,255,231,0.4);}
.ng-center{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:1;}
.ng-score-main{font-family:'Bebas Neue',sans-serif;font-size:52px;color:#fff;letter-spacing:4px;text-shadow:0 0 20px rgba(255,255,255,0.4);line-height:1;display:flex;align-items:center;}
.ng-score-main .sep{color:rgba(0,255,231,0.4);font-size:36px;margin:0 4px;}
.ng-overs{font-size:13px;color:var(--neon);letter-spacing:3px;text-shadow:0 0 6px rgba(0,255,231,0.5);}
.ng-batters{flex:1;display:flex;flex-direction:column;gap:4px;padding:8px 14px;z-index:1;border-left:1px solid rgba(0,255,231,0.1);border-right:1px solid rgba(0,255,231,0.1);}
.ng-batter{display:flex;justify-content:space-between;align-items:center;}
.ng-b-name{font-size:15px;font-weight:900;text-transform:uppercase;color:#fff;letter-spacing:.5px;}
.ng-b-name.striker{color:var(--neon);text-shadow:0 0 8px rgba(0,255,231,0.5);}
.ng-b-stat{font-size:14px;color:rgba(255,255,255,0.6);}
.ng-bowl{flex:1;display:flex;align-items:center;gap:12px;padding:8px 14px;z-index:1;border-left:1px solid rgba(255,0,168,0.2);}
.ng-bowl-name{font-size:16px;font-weight:900;text-transform:uppercase;color:var(--neon-pink);text-shadow:0 0 8px rgba(255,0,168,0.5);}
.ng-bowl-fig{font-size:14px;color:rgba(255,255,255,0.6);}
.ng-ball{width:22px;height:22px;background:transparent;border:1px solid var(--neon);color:var(--neon);font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 6px rgba(0,255,231,0.4);}
.ng-ball.small-text{font-size:8px;}
.ng-rates{display:flex;flex-direction:column;gap:2px;padding:0 14px;border-left:1px solid rgba(0,255,231,0.1);z-index:1;}
.ng-rate{font-size:13px;color:rgba(0,255,231,0.6);letter-spacing:1px;white-space:nowrap;}
.ng-rate span{color:var(--neon);text-shadow:0 0 6px rgba(0,255,231,0.5);}
.ng-bowl-side{display:flex;align-items:center;gap:8px;padding:0 14px;min-width:180px;flex-shrink:0;z-index:1;border-left:1px solid rgba(255,0,168,0.2);flex-direction:row-reverse;}
.ng-badge-pink{width:52px;height:52px;border-radius:8px;border:1px solid var(--neon-pink);background:rgba(255,0,168,0.08);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 12px rgba(255,0,168,0.3);}
.ng-bowl-team-name{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;color:var(--neon-pink);text-shadow:0 0 8px rgba(255,0,168,0.5);line-height:1;text-align:right;}
.ng-bowl-sub{font-size:18px;color:rgba(255,255,255,0.7);text-align:right;}
.bb-winner-full{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;background:#050913;border-top:2px solid var(--neon);z-index:20;}
.bb-winner-full .w-title{font-family:'Bebas Neue',sans-serif;font-size:54px;color:var(--neon);text-shadow:0 0 30px rgba(0,255,231,0.8);line-height:1;letter-spacing:3px;}
.bb-winner-full .w-desc{font-size:22px;color:#fff;font-weight:900;letter-spacing:3px;margin-top:4px;text-shadow:0 0 10px rgba(255,255,255,0.4);}
</style>

    </div>
  </div>
  <div id="innings-card" style="display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:900px;max-width:calc(100vw - 80px);background:#050913;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,255,231,0.3),0 30px 80px rgba(0,0,0,0.95);border-bottom:2px solid var(--neon);z-index:20;"><div class="ic-header" style="display:flex;align-items:center;gap:16px;padding:14px 20px;background:rgba(0,255,231,0.05);border-bottom:1px solid rgba(0,255,231,0.2);"><div id="ic-logo" style="width:52px;height:52px;border-radius:8px;border:1px solid var(--neon);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;background:rgba(0,255,231,0.08);"></div><div style="flex:1;"><div id="ic-team-name" style="font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:4px;color:var(--neon);text-shadow:0 0 10px rgba(0,255,231,0.5);">TEAM</div><div id="ic-subtitle" style="font-size:13px;color:rgba(0,255,231,0.6);letter-spacing:2px;">OVERS 0.0</div></div><div><div id="ic-total-badge" style="font-family:'Bebas Neue',sans-serif;font-size:36px;color:#fff;text-align:right;text-shadow:0 0 10px rgba(0,255,231,0.4);">0/0</div><div id="ic-overs-badge" style="font-size:14px;color:rgba(0,255,231,0.6);text-align:right;">OVERS 0.0</div></div></div><div style="max-height:60vh;overflow-y:auto;"><div id="ic-bat-title" style="padding:8px 20px;background:rgba(0,255,231,0.05);color:var(--neon);font-size:14px;font-weight:900;letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid rgba(0,255,231,0.1);">BATTING</div><div id="target-strip"></div><table style="width:100%;border-collapse:collapse;"><thead><tr style="background:rgba(0,255,231,0.03);"><th style="padding:8px 20px;font-size:12px;color:rgba(0,255,231,0.5);text-align:left;">BATSMAN</th><th style="padding:8px 20px;font-size:12px;color:rgba(0,255,231,0.5);text-align:right;">R</th><th style="padding:8px 20px;font-size:12px;color:rgba(0,255,231,0.5);text-align:right;">B</th><th style="padding:8px 20px;font-size:12px;color:rgba(0,255,231,0.5);text-align:right;">4s</th><th style="padding:8px 20px;font-size:12px;color:rgba(0,255,231,0.5);text-align:right;">6s</th><th style="padding:8px 20px;font-size:12px;color:rgba(0,255,231,0.5);text-align:right;">SR</th></tr></thead><tbody id="ic-bat-tbody"></tbody></table><div id="ic-bowl-title" style="padding:8px 20px;background:rgba(0,255,231,0.05);color:var(--neon);font-size:14px;font-weight:900;letter-spacing:2px;text-transform:uppercase;border-top:1px solid rgba(0,255,231,0.1);border-bottom:1px solid rgba(0,255,231,0.1);">BOWLING</div><table style="width:100%;border-collapse:collapse;"><thead><tr style="background:rgba(0,255,231,0.03);"><th style="padding:8px 20px;font-size:12px;color:rgba(0,255,231,0.5);text-align:left;">BOWLER</th><th style="padding:8px 20px;font-size:12px;color:rgba(0,255,231,0.5);text-align:right;">O</th><th style="padding:8px 20px;font-size:12px;color:rgba(0,255,231,0.5);text-align:right;">R</th><th style="padding:8px 20px;font-size:12px;color:rgba(0,255,231,0.5);text-align:right;">W</th><th style="padding:8px 20px;font-size:12px;color:rgba(0,255,231,0.5);text-align:right;">ECON</th></tr></thead><tbody id="ic-bowl-tbody"></tbody></table></div><div style="display:flex;justify-content:space-between;padding:10px 16px;background:rgba(0,255,231,0.03);border-top:1px solid rgba(0,255,231,0.1);"><span style="font-size:14px;color:rgba(0,255,231,0.5);">EXTRAS <span id="ic-extras-val" style="color:#fff;margin-left:6px;">0</span></span><span style="font-size:14px;color:rgba(0,255,231,0.5);">TOTAL <span id="ic-footer-total" style="color:#fff;margin-left:6px;">0/0</span></span></div></div>

function renderBroadcastBar(m,t){
  const bat=t.find(x=>x.id===m.batTeamId),bowl=t.find(x=>x.id===m.bowlTeamId);
  document.getElementById('bb-logo-bat-inner').innerHTML='';document.getElementById('bb-logo-bowl-inner').innerHTML='';
  document.getElementById('bb-bat-name').textContent=bat?(bat.shortName||bat.name.substring(0,4).toUpperCase()):'BAT';document.getElementById('bb-bowl-name').textContent=bowl?(bowl.shortName||bowl.name.substring(0,4).toUpperCase()):'BWL';
  document.getElementById('bb-bat-score').textContent=`${m.runs||0}/${m.wickets||0}`;document.getElementById('bb-bowl-sub').textContent=m.inning===2?`TGT ${m.target||0}`:'—';
  if(m.isFinished){document.getElementById('bb-winner-ui').style.display='flex';document.getElementById('w-big-text').textContent=m.winner.toUpperCase();document.getElementById('w-sub-text').textContent=m.winDesc.toUpperCase();}
  else{document.getElementById('bb-winner-ui').style.display='none';document.getElementById('bb-p1-name').textContent=(m||matchData)?.p1?.name||'STRIKER';{const _o=(m||matchData)?.batsmanStats?.[(m||matchData)?.p1?.name]?.out;const _e=document.getElementById('bb-p1-name');if(_e)_e.style.color=_o?'rgba(255,255,255,0.32)':'';}document.getElementById('bb-p1-stat').textContent=`${m.p1?.runs||0}(${m.p1?.balls||0})`;document.getElementById('bb-p2-name').textContent=m.p2?.name||'NON-STRIKER';document.getElementById('bb-p2-stat').textContent=`${m.p2?.runs||0}(${m.p2?.balls||0})`;document.getElementById('bb-bowler-name').textContent=m.bowler?m.bowler.toUpperCase():'BOWLER';document.getElementById('bb-bowler-stats').textContent=`(${m.bowlerWickets||0}-${m.bowlerRuns||0})`;document.getElementById('bb-thisover').innerHTML=m.thisOverBalls?.length?m.thisOverBalls.map(b=>`<div class="ng-ball${b.toString().length>2?' small-text':''}">${b}</div>`).join(''):'—';}
  document.getElementById('bb-main-score').innerHTML=`${m.runs||0}<span class="sep">/</span>${m.wickets||0}`;document.getElementById('bb-overs').textContent=`OVERS ${Math.floor((m.balls||0)/6)}.${(m.balls||0)%6}`;document.getElementById('bb-crr-center').textContent=((m.runs||0)/((m.balls||0)/6||0.01)).toFixed(2);

}
