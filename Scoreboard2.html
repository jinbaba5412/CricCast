<style>
/* ── LAYOUT 2: IPL PREMIUM ── */
:root{--gold:#f59e0b;--blue:#1e3a8a;--danger:#ef4444;--text:#e2e8f0;--muted:#94a3b8;--bat-color:#0047AB;--bowl-color:#B22222;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Barlow Condensed',sans-serif;font-weight:700;background:transparent;color:var(--text);overflow:hidden;}.overlay-wrap{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:fixed;inset:0;padding:0 0 10px 0;z-index:100;}

/* TWO-ROW IPL style bar */
.broadcast-bar{display:flex;flex-direction:column;width:100%;background:transparent;position:relative;overflow:visible;}
/* Top row: teams + score */
.ipl-top{display:flex;height:72px;width:100%;}
.ipl-bat-block{display:flex;align-items:center;gap:0;width:280px;background:var(--bat-color);padding:0 16px;position:relative;clip-path:polygon(0 0,100% 0,calc(100% - 20px) 100%,0 100%);flex-shrink:0;}
.ipl-bat-block::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0.15) 0%,transparent 100%);pointer-events:none;}
.ipl-logo{width:54px;height:54px;border:2px solid rgba(255,255,255,0.4);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
.ipl-logo img,.ipl-logo svg{width:42px;height:42px;object-fit:contain;}
.ipl-team-info{padding-left:12px;}
.ipl-team-name{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:2px;color:#fff;line-height:1;}
.ipl-team-score{font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--gold);letter-spacing:2px;line-height:1;}
/* Center score block */
.ipl-center{flex:1;background:#0a0f1e;display:flex;align-items:center;justify-content:center;flex-direction:column;border-top:3px solid var(--gold);border-bottom:3px solid rgba(255,255,255,0.05);}
.ipl-main-score{font-family:'Bebas Neue',sans-serif;font-size:54px;letter-spacing:4px;color:#fff;line-height:1;}
.ipl-overs{font-size:15px;color:var(--muted);letter-spacing:2px;}
/* Bowl side */
.ipl-bowl-block{display:flex;align-items:center;gap:0;width:280px;background:var(--bowl-color);padding:0 16px;position:relative;clip-path:polygon(20px 0,100% 0,100% 100%,0 100%);flex-shrink:0;flex-direction:row-reverse;}
.ipl-bowl-block::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0.15) 0%,transparent 100%);pointer-events:none;}
.ipl-bowl-info{padding-right:12px;text-align:right;}
/* Bottom row: batsmen + rates */
.ipl-bottom{display:flex;height:46px;width:100%;background:rgba(8,12,24,0.98);border-top:2px solid rgba(245,158,11,0.4);border-bottom:3px solid var(--gold);}
.ipl-batter{display:flex;align-items:center;flex:1;padding:0 20px;gap:16px;border-right:1px solid rgba(255,255,255,0.08);}
.ipl-batter-name{font-size:17px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:var(--gold);}
.ipl-batter-stat{font-size:15px;color:rgba(255,255,255,0.7);}
.ipl-divider{width:1px;}
.ipl-rates{display:flex;align-items:center;gap:20px;padding:0 20px;flex-shrink:0;}
.ipl-rate{font-size:15px;color:rgba(255,255,255,0.6);letter-spacing:1px;font-weight:700;}
.ipl-rate span{color:#fff;}
.ipl-bowler-info{display:flex;align-items:center;flex:1;padding:0 20px;gap:10px;justify-content:flex-end;}
.ipl-bowler-name{font-size:17px;font-weight:900;text-transform:uppercase;color:rgba(255,255,255,0.9);}
.ipl-bowler-fig{font-size:15px;color:rgba(255,255,255,0.5);}
.ipl-balls{display:flex;gap:5px;align-items:center;}
.mini-chip{width:24px;height:24px;background:#fff;color:#000;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.mini-chip.small-text{font-size:9px;}
.bb-winner-full{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;background:linear-gradient(135deg,var(--blue),var(--bat-color));z-index:20;}
.bb-winner-full .w-title{font-family:'Bebas Neue',sans-serif;font-size:60px;color:var(--gold);line-height:1;letter-spacing:3px;}
.bb-winner-full .w-desc{font-size:24px;color:#fff;font-weight:900;letter-spacing:3px;margin-top:4px;}
</style>
</head>
<body>

      <div class="ipl-rates">

      </div>
      <div style="width:1px;margin:8px 0;"></div>
      <div class="ipl-bowler-info">
        <div>
          <div class="ipl-bowler-name" id="bb-bowler-name">BOWLER</div>
          <div class="ipl-bowler-fig" id="bb-bowler-stats">(0-0)</div>
        </div>

    </div>
  </div>
  <!-- Shared overlays -->
  <div id="innings-card" style="display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:900px;max-width:calc(100vw - 80px);background:rgba(5,8,18,0.97);border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,0.95);border-bottom:4px solid var(--gold);z-index:20;">
    <div class="ic-header" style="display:flex;align-items:center;gap:16px;padding:14px 20px;background:linear-gradient(135deg,var(--bat-color),rgba(0,0,0,0.5));border-bottom:1px solid rgba(255,255,255,0.1);">
      <div id="ic-logo" style="width:52px;height:52px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;"></div>
      <div style="flex:1;"><div id="ic-team-name" style="font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:4px;color:#fff;">TEAM</div><div id="ic-subtitle" style="font-size:13px;color:rgba(255,255,255,0.6);letter-spacing:2px;">OVERS 0.0</div></div>
      <div><div id="ic-total-badge" style="font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--gold);text-align:right;">0/0</div><div id="ic-overs-badge" style="font-size:14px;color:rgba(255,255,255,0.6);text-align:right;">OVERS 0.0</div></div>
    </div>
    <div style="max-height:60vh;overflow-y:auto;">
      <div id="ic-bat-title" style="padding:8px 20px;background:rgba(0,0,0,0.4);color:var(--gold);font-size:14px;font-weight:900;letter-spacing:2px;text-transform:uppercase;">BATTING</div>
      <div id="target-strip"></div><table style="width:100%;border-collapse:collapse;"><thead><tr style="background:rgba(255,255,255,0.02);"><th style="padding:8px 20px;font-size:12px;color:var(--muted);text-align:left;">BATSMAN</th><th style="padding:8px 20px;font-size:12px;color:var(--muted);text-align:right;">R</th><th style="padding:8px 20px;font-size:12px;color:var(--muted);text-align:right;">B</th><th style="padding:8px 20px;font-size:12px;color:var(--muted);text-align:right;">4s</th><th style="padding:8px 20px;font-size:12px;color:var(--muted);text-align:right;">6s</th><th style="padding:8px 20px;font-size:12px;color:var(--muted);text-align:right;">SR</th></tr></thead><tbody id="ic-bat-tbody"></tbody></table>
      <div id="ic-bowl-title" style="padding:8px 20px;background:rgba(0,0,0,0.4);color:var(--gold);font-size:14px;font-weight:900;letter-spacing:2px;text-transform:uppercase;border-top:1px solid rgba(255,255,255,0.05);">BOWLING</div>
      <table style="width:100%;border-collapse:collapse;"><thead><tr style="background:rgba(255,255,255,0.02);"><th style="padding:8px 20px;font-size:12px;color:var(--muted);text-align:left;">BOWLER</th><th style="padding:8px 20px;font-size:12px;color:var(--muted);text-align:right;">O</th><th style="padding:8px 20px;font-size:12px;color:var(--muted);text-align:right;">R</th><th style="padding:8px 20px;font-size:12px;color:var(--muted);text-align:right;">W</th><th style="padding:8px 20px;font-size:12px;color:var(--muted);text-align:right;">ECON</th></tr></thead><tbody id="ic-bowl-tbody"></tbody></table>
    </div>
    <div style="display:flex;justify-content:space-between;padding:10px 16px;background:rgba(255,255,255,0.03);border-top:1px solid rgba(255,255,255,0.08);">
      <span style="font-size:14px;color:var(--muted);">EXTRAS <span id="ic-extras-val" style="color:#fff;margin-left:6px;">0</span></span>
      <span style="font-size:14px;color:var(--muted);">TOTAL <span id="ic-footer-total" style="color:#fff;margin-left:6px;">0/0</span></span>
    </div>
  </div>
  <div id="match-summary-card" style="display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:1000px;max-width:calc(100vw - 80px);background:rgba(5,8,18,0.98);border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,0.95);z-index:20;">
    <div style="padding:18px 28px;background:linear-gradient(135deg,rgba(30,64,175,0.6),rgba(0,0,0,0.4));border-bottom:2px solid var(--gold);text-align:center;"><div style="font-family:'Bebas Neue',sans-serif;font-size:42px;letter-spacing:6px;color:var(--gold);">MATCH SUMMARY</div></div>

</div>

<script>
function renderBroadcastBar(matchData, teamsData) {
  const batTeam=teamsData.find(t=>t.id===matchData.batTeamId);
  const bowlTeam=teamsData.find(t=>t.id===matchData.bowlTeamId);
  document.getElementById('bb-logo-bat-inner').innerHTML='';
  document.getElementById('bb-logo-bowl-inner').innerHTML='';
  document.getElementById('bb-bat-name').textContent=batTeam?batTeam.name.toUpperCase():'BATTING';
  document.getElementById('bb-bowl-name').textContent=bowlTeam?bowlTeam.name.toUpperCase():'BOWLING';
  document.getElementById('bb-bat-score').textContent=`${matchData.runs||0}/${matchData.wickets||0}`;
  document.getElementById('bb-target-ipl').textContent=matchData.inning===2?`TARGET ${matchData.target||0}`:'—';
  const uiwinner=document.getElementById('bb-winner-ui');
  if(matchData.isFinished){uiwinner.style.display='flex';document.getElementById('w-big-text').textContent=matchData.winner.toUpperCase();document.getElementById('w-sub-text').textContent=matchData.winDesc.toUpperCase();}
  else{uiwinner.style.display='none';
    document.getElementById('bb-p1-name').textContent=(matchData||m)?.p1?.name||'STRIKER';{const _o=(matchData||m)?.batsmanStats?.[(matchData||m)?.p1?.name]?.out;const _e=document.getElementById('bb-p1-name');if(_e)_e.style.color=_o?'rgba(255,255,255,0.32)':'';}document.getElementById('bb-p1-stat').textContent=`${matchData.p1?.runs||0} (${matchData.p1?.balls||0})`;
    document.getElementById('bb-p2-name').textContent=matchData.p2?.name||'NON-STRIKER';document.getElementById('bb-p2-stat').textContent=`${matchData.p2?.runs||0} (${matchData.p2?.balls||0})`;
    const _bEl=document.getElementById('bb-bowler-name');if(_bEl){const _bp=matchData.bowler?matchData.bowler.trim().split(' '):[];const _bd=_bp.length>=3?_bp[1]:(_bp[0]||'');_bEl.textContent=_bd?_bd.toUpperCase():'BOWLER';const _bw=matchData.bowler&&!(matchData.thisOverBalls||[]).length&&(matchData.balls||0)>0;_bEl.style.color=_bw?'rgba(255,255,255,0.32)':'';}document.getElementById('bb-bowler-stats').textContent=`(${matchData.bowlerWickets||0}-${matchData.bowlerRuns||0})`;
    document.getElementById('bb-thisover').innerHTML=matchData.thisOverBalls?.length?matchData.thisOverBalls.map(b=>`<div class="mini-chip${b.toString().length>2?' small-text':''}">${b}</div>`).join(''):'—';
  }
  document.getElementById('bb-main-score').innerHTML=`${matchData.runs||0}<span style="color:rgba(255,255,255,0.3);font-size:38px;">/</span>${matchData.wickets||0}`;
  document.getElementById('bb-overs').textContent=`OVERS ${Math.floor((matchData.balls||0)/6)}.${(matchData.balls||0)%6}`;
  document.getElementById('bb-crr-center').textContent=((matchData.runs||0)/((matchData.balls||0)/6||0.01)).toFixed(2);
  if(matchData.inning===2){document.getElementById('bb-rrr-box').style.visibility='visible';const r=Math.max(0,(matchData.target||0)-(matchData.runs||0)),b=(matchData.maxOvers*6)-(matchData.balls||0);document.getElementById('bb-rrr-center').textContent=b>0?(r/(b/6)).toFixed(2):'0.00';}
  else{document.getElementById('bb-rrr-box').style.visibility='hidden';}
}
// Shared styles for overlays
const st=document.createElement('style');st.textContent=`:root{--muted:#94a3b8;}
.ic-table{width:100%;border-collapse:collapse;}.ic-table thead tr{background:rgba(255,255,255,0.02);border-bottom:1px solid rgba(255,255,255,0.1);}
.ic-table th{padding:8px 20px;font-size:12px;font-weight:900;letter-spacing:2px;color:var(--muted);text-transform:uppercase;text-align:left;}.ic-table th:not(:first-child){text-align:right;}
.ic-table tbody tr{border-bottom:1px solid rgba(255,255,255,0.03);}.ic-table tbody tr.striker-row{background:transparent;}
.ic-table td{padding:9px 20px;font-size:16px;font-weight:700;color:#fff;text-align:left;}.ic-table td:not(:first-child){text-align:right;}

.ic-runs{font-size:20px;font-weight:900;}.ic-balls{color:var(--muted);}.ic-4{color:#6ee7b7;}.ic-6{color:#5eead4;}.ic-sr{color:var(--muted);font-size:14px;}
.ms-innings{padding:20px 24px;}.ms-innings:first-child{border-right:1px solid rgba(255,255,255,0.07);}
.ms-inn-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,0.08);}
.ms-inn-logo{width:44px;height:44px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
