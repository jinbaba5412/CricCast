/* ── LAYOUT 1: CLASSIC DARK REFINED ── */
:root{--gold:#f59e0b;--blue:#1e40af;--danger:#dc2626;--text:#e2e8f0;--muted:#94a3b8;--bat-color:#1e40af;--bowl-color:#0f1625;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Barlow Condensed',sans-serif;font-weight:700;background:transparent;color:var(--text);overflow:hidden;}.overlay-wrap{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:fixed;inset:0;padding:0 0 10px 0;z-index:100;}

/* Refined horizontal classic bar — longer, tighter */
.broadcast-bar{display:flex;height:88px;width:100%;background:rgba(4,6,12,0.98);border-top:2px solid var(--gold);border-bottom:3px solid var(--gold);box-shadow:0 -8px 40px rgba(245,158,11,0.15),0 10px 40px rgba(0,0,0,0.9);position:relative;overflow:visible;}
.broadcast-bar::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent 60px,rgba(255,255,255,0.01) 60px,rgba(255,255,255,0.01) 61px);pointer-events:none;}
.bb-logo{width:88px;display:flex;align-items:center;justify-content:center;flex-shrink:0;z-index:10;position:relative;}
#bb-logo-left{background:linear-gradient(180deg,var(--bat-color),rgba(0,0,0,0.8));}
#bb-logo-right{background:linear-gradient(180deg,var(--bowl-color),rgba(0,0,0,0.8));}
.bb-logo img,.bb-logo svg{height:56px;width:56px;object-fit:contain;}
/* Team name side tabs */
.bb-team-tab{width:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;padding:0 8px;gap:2px;}
#bb-tab-bat{background:linear-gradient(90deg,var(--bat-color),rgba(0,0,0,0.3));border-right:1px solid rgba(255,255,255,0.1);}
#bb-tab-bowl{background:linear-gradient(270deg,var(--bowl-color),rgba(0,0,0,0.3));border-left:1px solid rgba(255,255,255,0.1);}
.bb-tab-name{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:#fff;text-align:center;line-height:1;}
.bb-tab-score{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--gold);letter-spacing:1px;}
/* Batting section */
.bb-batting{flex:1;padding:10px 30px 10px 16px;background:linear-gradient(90deg,rgba(0,0,0,0.5) 0%,transparent 80%);display:flex;flex-direction:column;justify-content:center;border-right:1px solid rgba(255,255,255,0.07);}
.bb-player{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:18px;text-transform:uppercase;letter-spacing:.5px;}
.bb-player.striker{}.bb-player .pstat{font-size:16px;opacity:.9;}
/* Score center */
.bb-score{width:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.9);flex-shrink:0;z-index:3;padding:0 10px;border-left:2px solid rgba(245,158,11,0.3);border-right:2px solid rgba(245,158,11,0.3);}
.bb-score .runs{font-family:'Bebas Neue',sans-serif;font-size:50px;line-height:1;letter-spacing:2px;display:flex;align-items:center;justify-content:center;}
.bb-score .overs{font-size:14px;color:var(--muted);font-weight:700;letter-spacing:1px;}
.score-rates-row{display:flex;justify-content:space-between;align-items:center;width:100%;padding:0 20px;margin-top:-2px;}
.rate-box{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:1px;}.rate-box span{color:#fff;}
.rate-box.danger{color:var(--danger);}.rate-box.danger span{color:#fff;}
/* Bowling section */
.bb-bowling-wrap{flex:1;display:flex;align-items:center;padding:10px 16px 10px 30px;gap:20px;background:linear-gradient(270deg,rgba(0,0,0,0.5) 0%,transparent 80%);border-left:1px solid rgba(255,255,255,0.07);}
.bb-stat-item{display:flex;flex-direction:column;gap:3px;}
.bb-stat-item .slabel{font-size:13px;color:rgba(255,255,255,0.5);font-weight:900;letter-spacing:1.5px;text-transform:uppercase;}
.bb-stat-item .sval{font-weight:900;font-size:18px;}
.bb-winner-full{flex:1;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:5;text-align:center;background:var(--blue);}
.bb-winner-full .w-title{font-family:'Bebas Neue',sans-serif;font-size:48px;color:var(--gold);line-height:1;letter-spacing:2px;}
.bb-winner-full .w-desc{font-size:20px;color:#fff;font-weight:900;letter-spacing:3px;text-transform:uppercase;margin-top:2px;}
.mini-white-chip{display:flex;align-items:center;justify-content:center;width:26px;height:26px;background:#fff;color:#000;font-size:13px;font-weight:900;flex-shrink:0;}
.mini-white-chip.small-text{font-size:10px;letter-spacing:-.5px;}
</style>

<script>
function renderBroadcastBar(matchData, teamsData) {
  const batTeam  = teamsData.find(t => t.id === matchData.batTeamId);
  const bowlTeam = teamsData.find(t => t.id === matchData.bowlTeamId);
  document.getElementById('bb-logo-bat-inner').innerHTML  = logoElBar(batTeam);
  document.getElementById('bb-logo-bowl-inner').innerHTML = logoElBar(bowlTeam);
  document.getElementById('bb-bat-name').textContent  = batTeam  ? (batTeam.shortName  || batTeam.name.substring(0,3).toUpperCase())  : 'BAT';
  document.getElementById('bb-bowl-name').textContent = bowlTeam ? (bowlTeam.shortName || bowlTeam.name.substring(0,3).toUpperCase()) : 'BWL';
  document.getElementById('bb-bat-sub').textContent   = `${matchData.runs||0}/${matchData.wickets||0}`;
  document.getElementById('bb-bowl-sub').textContent  = matchData.inning===2 ? `TGT ${matchData.target||0}` : '—';
  const uibat=document.getElementById('bb-batting-ui'),uiscore=document.getElementById('bb-score-ui'),uibowl=document.getElementById('bb-bowling-ui'),uiwinner=document.getElementById('bb-winner-ui');
  if(matchData.isFinished){uibat.style.display='none';uiscore.style.display='none';uibowl.style.display='none';uiwinner.style.display='flex';document.getElementById('w-big-text').textContent=matchData.winner.toUpperCase();document.getElementById('w-sub-text').textContent=matchData.winDesc.toUpperCase();}
  else{uibat.style.display='flex';uiscore.style.display='flex';uibowl.style.display='flex';uiwinner.style.display='none';
    document.getElementById('bb-p1-name').innerHTML=_bsvg+(matchData.p1?.name||'STRIKER');document.getElementById('bb-p1-stat').textContent=`${matchData.p1?.runs||0}(${matchData.p1?.balls||0})`;
    document.getElementById('bb-p2-name').textContent=matchData.p2?.name||'NON-STRIKER';document.getElementById('bb-p2-stat').textContent=`${matchData.p2?.runs||0}(${matchData.p2?.balls||0})`;
    const _bEl=document.getElementById('bb-bowler-name');if(_bEl){const _bp=matchData.bowler?matchData.bowler.trim().split(' '):[];const _bd=_bp.length>=3?_bp[1]:(_bp[0]||'');_bEl.textContent=_bd?_bd.toUpperCase():'BOWLER';const _bw=matchData.bowler&&!(matchData.thisOverBalls||[]).length&&(matchData.balls||0)>0;_bEl.style.color=_bw?'rgba(255,255,255,0.32)':'';}document.getElementById('bb-bowler-stats').textContent=`(${matchData.bowlerWickets||0}-${matchData.bowlerRuns||0})`;
    document.getElementById('bb-thisover').innerHTML=matchData.thisOverBalls?.length?matchData.thisOverBalls.map(b=>`<div class="mini-white-chip${b.toString().length>2?' small-text':''}">${b}</div>`).join(''):'—';
  }
  document.getElementById('bb-runs-wkt').innerHTML=`${matchData.runs||0}<span style="color:#555;font-size:38px;">/</span>${matchData.wickets||0}`;
  document.getElementById('bb-overs').textContent=`${Math.floor((matchData.balls||0)/6)}.${(matchData.balls||0)%6} OV`;
  document.getElementById('bb-crr-center').textContent=((matchData.runs||0)/((matchData.balls||0)/6||0.01)).toFixed(2);
  if(matchData.inning===2){document.getElementById('target-box').style.display='flex';document.getElementById('bb-target').textContent=matchData.target||0;document.getElementById('bb-rrr-box').style.visibility='visible';const r=Math.max(0,(matchData.target||0)-(matchData.runs||0)),b=(matchData.maxOvers*6)-(matchData.balls||0);document.getElementById('bb-rrr-center').textContent=b>0?(r/(b/6)).toFixed(2):'0.00';}
  else{document.getElementById('target-box').style.display='none';document.getElementById('bb-rrr-box').style.visibility='hidden';}
}

.ts-list-header{display:grid;grid-template-columns:36px 1fr 90px;padding:8px 20px;background:rgba(0,0,0,0.4);border-bottom:1px solid rgba(255,255,255,0.06);font-size:12px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
.ts-player-row{display:grid;grid-template-columns:36px 1fr 90px;align-items:center;padding:10px 20px;border-bottom:1px solid rgba(255,255,255,0.03);}
.ts-player-num{color:var(--muted);font-size:15px;font-weight:700;}.ts-player-name{font-size:18px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:#fff;}.ts-player-role{display:flex;align-items:center;}
.role-chip{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--muted);}
.role-chip.bat{background:rgba(245,158,11,0.2);color:var(--gold);}.role-chip.bowl{background:rgba(220,38,38,0.2);color:#fca5a5;}.role-chip.wk{background:rgba(16,185,129,0.2);color:#6ee7b7;}.role-chip.all{background:rgba(139,92,246,0.2);color:#c4b5fd;}
.ts-footer{padding:12px 20px;text-align:center;}
/* Innings table */
.ic-table{width:100%;border-collapse:collapse;}.ic-table thead tr{background:rgba(255,255,255,0.02);border-bottom:1px solid rgba(255,255,255,0.1);}
.ic-table th{padding:8px 20px;font-size:12px;font-weight:900;letter-spacing:2px;color:var(--muted);text-transform:uppercase;text-align:left;}.ic-table th:not(:first-child){text-align:right;}
.ic-table tbody tr{border-bottom:1px solid rgba(255,255,255,0.03);}.ic-table tbody tr.striker-row{background:transparent;}
.ic-table td{padding:9px 20px;font-size:16px;font-weight:700;color:#fff;text-align:left;}.ic-table td:not(:first-child){text-align:right;}
.ic-table td.batter-name{font-size:17px;font-weight:900;text-transform:uppercase;}.ic-table td.batter-name .not-out{color:var(--gold);font-size:12px;margin-left:4px;vertical-align:super;}.ic-table td.batter-name .out-label{font-size:12px;color:var(--muted);font-weight:700;display:block;}
.ic-runs{font-size:20px;font-weight:900;}.ic-balls{color:var(--muted);}.ic-4{color:#6ee7b7;}.ic-6{color:#5eead4;}.ic-sr{color:var(--muted);font-size:14px;}
