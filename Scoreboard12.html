<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CricCast — SB12: Neon Glow Dark</title>
<style type="text/css">@font-face{font-family:Bebas Neue;src:url(https://fonts.gstatic.com/s/bebasneue/v14/JTUSjIg69CK48gW7PXoo9Wlhyw.woff2);font-display:swap;}@font-face{font-family:Barlow Condensed;font-style:normal;font-weight:700;src:url(https://fonts.gstatic.com/s/barlowcondensed/v12/HTxwLwI-JCGChYJ8VI-L6OO_au7B43_3z3b-.woff2);font-display:swap;}@font-face{font-family:Barlow Condensed;font-style:normal;font-weight:900;src:url(https://fonts.gstatic.com/s/barlowcondensed/v12/HTxwLwI-JCGChYJ8VI-L6OO_au7B45_1z3b-.woff2);font-display:swap;}</style>
<style>
:root{--gold:#f59e0b;--bat-color:#1e40af;--bowl-color:#7f1d1d;--text:#e2e8f0;--muted:#94a3b8;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Barlow Condensed',sans-serif;font-weight:700;background:transparent;color:var(--text);overflow:hidden;}.overlay-wrap{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:fixed;inset:0;padding:0 0 10px 0;z-index:100;}


.broadcast-bar{width:1200px;max-width:calc(100vw - 60px);height:90px;background:rgba(2,6,15,0.95);border:1px solid rgba(99,102,241,0.4);border-bottom:3px solid #6366f1;border-radius:8px;display:flex;overflow:visible;box-shadow:0 0 40px rgba(99,102,241,0.3),inset 0 1px 0 rgba(255,255,255,0.05);}
.n-side{width:90px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(99,102,241,0.2),transparent);flex-shrink:0;position:relative;overflow:visible;}
.n-bat{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 20px;border-right:1px solid rgba(255,255,255,0.06);}
.n-p{font-size:17px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:#a5b4fc;}
.n-p.str{color:#fff;text-shadow:0 0 10px rgba(99,102,241,0.8);}
.n-ps{font-size:14px;color:rgba(255,255,255,0.4);}
.n-center{width:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;}
.n-runs{font-family:'Bebas Neue',sans-serif;font-size:52px;color:#fff;letter-spacing:3px;line-height:1;text-shadow:0 0 20px rgba(99,102,241,0.6);}
.n-overs{font-size:14px;color:#818cf8;letter-spacing:2px;}
.n-bowl{flex:1;display:flex;align-items:center;padding:0 20px;gap:20px;border-left:1px solid rgba(255,255,255,0.06);}
.n-bl{font-size:12px;color:rgba(255,255,255,0.3);letter-spacing:1.5px;text-transform:uppercase;}
.n-bv{font-size:17px;font-weight:900;color:#fff;}
.n-over-dots{display:flex;gap:5px;}
.n-dot{width:24px;height:24px;background:rgba(99,102,241,0.3);border:1px solid #6366f1;color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;}

</style>
</head>
<body>
<div class="overlay-wrap" id="master-wrap" style="display:none;">
  <div class="broadcast-bar" id="master-broadcast-bar" style="display:none;">

    <div class="n-side" id="n-logo-l"></div>
    <div class="n-bat" style="padding-left:24px;">
      <div class="n-p str" id="n-p1">STRIKER</div><div class="n-ps" id="n-p1s">0(0)</div>
      <div class="n-p" id="n-p2">NON-STRIKER</div><div class="n-ps" id="n-p2s">0(0)</div>
    </div>
    <div class="n-center">
      <div class="n-runs"><span id="n-nick" style="font-size:28px;color:#818cf8;margin-right:8px;"></span><span id="n-rw">0/0</span></div>
      <div class="n-overs" id="n-overs">OVERS 0.0</div>
    </div>
    <div class="n-bowl">
      <div><div class="n-bl">BOWLER</div><div class="n-bv" id="n-bwl">—</div></div>
      <div><div class="n-bl">FIGURES</div><div class="n-bv" id="n-bwlf" style="color:#818cf8;">0-0</div></div>
      <div id="n-tgt-wrap" style="display:none;"><div class="n-bl">TARGET</div><div class="n-bv" id="n-tgt" style="color:#fca5a5;">0</div></div>
      <div class="n-over-dots" id="n-dots" style="margin-left:auto;"></div>
    </div>
    <div class="n-side" id="n-logo-r"></div>

  </div>
  <div id="innings-card" style="display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:25;width:900px;max-width:calc(100vw - 40px);"></div>
  <div id="match-summary-card" style="display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:25;width:1000px;max-width:calc(100vw - 40px);"></div>
  <div id="team-sheet-card" data-active-tab="bat" style="display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:30;width:800px;max-width:calc(100vw - 40px);"></div>
</div>
<script src="scoreboard-core-offline.js"></script>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/EasePack.min.js"></script>
<script src="vendor/confetti.min.js"></script>
<script src="BroadcastEvents.js"></script>
<script>

function renderBroadcastBar(m,t){
  const bat=t.find(x=>x.id===m.batTeamId),bowl=t.find(x=>x.id===m.bowlTeamId);
  document.getElementById('n-logo-l').innerHTML=logoElBar(bat);
  document.getElementById('n-logo-r').innerHTML=logoElBar(bowl);
  document.getElementById('n-nick').textContent=bat?(bat.shortName||bat.name.substring(0,3).toUpperCase()):'';
  document.getElementById('n-rw').textContent=`${m.runs||0}/${m.wickets||0}`;
  // Wave 7.2 — drop INN prefix; target presence already conveys innings.
  document.getElementById('n-overs').textContent=`OVERS ${Math.floor((m.balls||0)/6)}.${(m.balls||0)%6}`;
  document.getElementById('n-p1').textContent=(m||matchData)?.p1?.name||'STRIKER';{const _o=(m||matchData)?.batsmanStats?.[(m||matchData)?.p1?.name]?.out;const _e=document.getElementById('n-p1');if(_e)_e.style.color=_o?'rgba(255,255,255,0.32)':'';}
  document.getElementById('n-p1s').textContent=`${m.p1?.runs||0} (${m.p1?.balls||0})`;
  document.getElementById('n-p2').textContent=m.p2?.name||'NON-STRIKER';
  document.getElementById('n-p2s').textContent=`${m.p2?.runs||0} (${m.p2?.balls||0})`;
  document.getElementById('n-bwl').textContent=(m.bowler||'—').toUpperCase();
  document.getElementById('n-bwlf').textContent=`${m.bowlerWickets||0}-${m.bowlerRuns||0}`;
  document.getElementById('n-tgt-wrap').style.display=m.inning===2?'':'none';
  if(m.inning===2) document.getElementById('n-tgt').textContent=m.target||0;
  document.getElementById('n-dots').innerHTML=(m.thisOverBalls||[]).slice(-6).map(b=>`<div class="n-dot">${b}</div>`).join('');
}

</script>
</body>
</html>
